# Constrói a imagem Docker do OmniReview e publica em ghcr.io/bryanpinaffo/omnireview (amd64 e arm64).
# Usada pelo app do CasaOS (deploy/casaos/docker-compose.yml). Roda a cada push que muda o back-end.
name: Imagem Docker

on:
  push:
    branches: [main]
    paths:
      - "backend-java/**"
      - ".github/workflows/imagem-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes do back-end
        working-directory: backend-java
        run: |
          chmod +x mvnw
          ./mvnw -q -B test -Dtest='!BackendApplicationTests'   # o teste de contexto precisa do Neo4j

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend-java
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bryanpinaffo/omnireview:latest
            ghcr.io/bryanpinaffo/omnireview:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
