spring.application.name=omnireview

# Segredos (chaves de API e senha do banco) ficam fora do código, em config/segredos.properties
# (ignorado pelo Git). Modelo: config/segredos.exemplo.properties.
# Também podem vir de variáveis de ambiente: OMNIREVIEW_TMDB_API_KEY, OMNIREVIEW_IGDB_CLIENT_ID,
# OMNIREVIEW_IGDB_CLIENT_SECRET, OMNIREVIEW_GOOGLEBOOKS_API_KEY, SPRING_NEO4J_AUTHENTICATION_PASSWORD, OMNIREVIEW_OLLAMA_URL.
spring.config.import=optional:file:./config/segredos.properties,optional:file:./backend-java/config/segredos.properties

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j

omnireview.ollama.url=http://localhost:11434
omnireview.ollama.modelo=llama3.2:3b
