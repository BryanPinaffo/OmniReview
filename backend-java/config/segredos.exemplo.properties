# Copie este arquivo para config/segredos.properties e preencha os valores.
spring.neo4j.authentication.password=SENHA_DO_NEO4J
omnireview.tmdb.api-key=SUA_CHAVE_TMDB
# Livros: Google Books (opcional, gratuita). Sem ela, os livros vêm só do Open Library.
omnireview.googlebooks.api-key=SUA_CHAVE_GOOGLE_BOOKS
# Jogos de todas as plataformas, lojas e tempo para zerar pelo IGDB (gratuito: aplicativo em dev.twitch.tv/console).
# Sem ele, os jogos vêm só da Steam (sem jogos de console).
omnireview.igdb.client-id=SEU_CLIENT_ID_TWITCH
omnireview.igdb.client-secret=SEU_CLIENT_SECRET_TWITCH
omnireview.ollama.url=http://ENDERECO_DO_OLLAMA:11434

# Conta de administrador criada (ou corrigida) ao iniciar o back-end
omnireview.admin.usuario=admin
omnireview.admin.senha=SENHA_DO_ADMIN
