# OmniReview para o CasaOS: App Store → "+" (Instalação personalizada) → Importar → cole este arquivo.
# Antes de importar, troque os valores TROQUE_... (ou use o arquivo já preenchido que fica fora do Git).
#
# Versão simples (só recursos que o importador do CasaOS aceita):
# - neo4j: banco, SEM portas publicadas (só o site fala com ele, pela rede interna do app);
# - omnireview: o site, na porta 18090 do servidor. O acesso público é pelo Tailscale Funnel (HTTPS).
# Para levar um banco exportado (neo4j.dump), restaure ANTES de instalar: veja deploy/casaos/LEIAME.md.
name: omnireview

services:
  neo4j:
    image: neo4j:2026.08.1
    container_name: omnireview-neo4j
    restart: unless-stopped
    networks:
      omnireview:
        aliases:
          - neo4j
    environment:
      NEO4J_AUTH: neo4j/TROQUE_SENHA_DO_NEO4J
    volumes:
      - type: bind
        source: /DATA/AppData/omnireview/neo4j/data
        target: /data
      - type: bind
        source: /DATA/AppData/omnireview/neo4j/logs
        target: /logs
    x-casaos:
      volumes:
        - container: /data
          description:
            en_us: Neo4j database
            pt_br: Banco de dados Neo4j
        - container: /logs
          description:
            en_us: Neo4j logs
            pt_br: Logs do Neo4j

  omnireview:
    image: ghcr.io/bryanpinaffo/omnireview:latest
    container_name: omnireview
    restart: unless-stopped
    depends_on:
      - neo4j
    networks:
      - omnireview
    ports:
      - target: 8080
        published: "18090"
        protocol: tcp
    environment:
      SPRING_NEO4J_URI: bolt://omnireview-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: TROQUE_SENHA_DO_NEO4J
      OMNIREVIEW_TMDB_API_KEY: TROQUE_CHAVE_TMDB
      OMNIREVIEW_RAWG_API_KEY: TROQUE_CHAVE_RAWG
      OMNIREVIEW_GOOGLEBOOKS_API_KEY: TROQUE_CHAVE_GOOGLE_BOOKS   # opcional: livros com sinopse em português
      OMNIREVIEW_IGDB_CLIENT_ID: TROQUE_CLIENT_ID_TWITCH           # opcional: tempo para zerar os jogos (IGDB)
      OMNIREVIEW_IGDB_CLIENT_SECRET: TROQUE_CLIENT_SECRET_TWITCH
      OMNIREVIEW_OLLAMA_URL: http://TROQUE_IP_DO_OLLAMA:11434
      OMNIREVIEW_ADMIN_USUARIO: admin
      OMNIREVIEW_ADMIN_SENHA: TROQUE_SENHA_DO_ADMIN
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: Web UI
            pt_br: Interface web

# Rede própria do app: na rede "bridge" padrão do Docker um container não encontra o outro pelo nome
networks:
  omnireview:
    name: omnireview

x-casaos:
  architectures:
    - amd64
    - arm64
  main: omnireview
  author: Bryan Pinaffo
  developer: Bryan Pinaffo
  category: Media
  port_map: "18090"
  index: /
  scheme: http
  title:
    en_us: OmniReview
    pt_br: OmniReview
  tagline:
    en_us: Transmedia recommendations for movies, series and games
    pt_br: Recomendações transmídia de filmes, séries e jogos
  description:
    en_us: Movies, series and games with the same creative DNA (Spring Boot + Neo4j + Ollama).
    pt_br: Filmes, séries e jogos com o mesmo DNA criativo (Spring Boot + Neo4j + Ollama).
  icon: https://raw.githubusercontent.com/BryanPinaffo/OmniReview/main/deploy/casaos/icone.png
